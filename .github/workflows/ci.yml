name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run format:check
      - name: Check initial JavaScript budget
        run: |
          node --input-type=module <<'JS'
          import { readdirSync, readFileSync } from 'node:fs';
          import { gzipSync } from 'node:zlib';
          const bytes = readdirSync('dist/assets').filter(name => name.endsWith('.js'))
            .reduce((total, name) => total + gzipSync(readFileSync(`dist/assets/${name}`)).length, 0);
          console.log(`Initial JavaScript: ${bytes} bytes gzip (limit: 110000)`);
          if (bytes >= 110000) process.exit(1);
          JS
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Save verified main build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site
          path: dist
          if-no-files-found: error
          retention-days: 7
