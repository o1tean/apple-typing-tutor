name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    container:
      image: swift:6.4.0-noble@sha256:31d14d727f4451f25e29bac9c42563a098c39ac66415e8bad970f48038e38aca
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare the matching Swift WebAssembly SDK
        run: |
          mkdir -p .local/swift-sdk
          node --input-type=module <<'JS'
          import { createHash } from 'node:crypto';
          import { writeFile } from 'node:fs/promises';
          const response = await fetch('https://download.swift.org/swift-6.4.0-release/wasm-sdk/swift-6.4.0-RELEASE/swift-6.4.0-RELEASE_wasm.artifactbundle.tar.gz');
          if (!response.ok) throw new Error(`Swift SDK download failed: ${response.status}`);
          const bytes = Buffer.from(await response.arrayBuffer());
          const digest = createHash('sha256').update(bytes).digest('hex');
          if (digest !== 'f07b7be3c586d92d7a07051fc6d303b87ebea67eadc40640ba59d5a8b79aa86d') {
            throw new Error('Swift SDK checksum mismatch');
          }
          await writeFile('.local/swift-sdk/sdk.tar.gz', bytes);
          JS
          tar -xzf .local/swift-sdk/sdk.tar.gz -C .local/swift-sdk
      - name: Verify Swift
        run: npm run test:swift
      - run: npm test
      - run: npm run build
      - run: npm run test:swift:wasm
      - run: npm run format:check
      - name: Check initial JavaScript budget
        run: |
          node --input-type=module <<'JS'
          import { readdirSync, readFileSync } from 'node:fs';
          import { gzipSync } from 'node:zlib';
          const bytes = readdirSync('dist/assets').filter(name => name.endsWith('.js'))
            .reduce((total, name) => total + gzipSync(readFileSync(`dist/assets/${name}`)).length, 0);
          console.log(`Initial JavaScript: ${bytes} bytes gzip (limit: 110000)`);
          if (bytes >= 110000) process.exit(1);
          JS
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Save verified main build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site
          path: dist
          if-no-files-found: error
          retention-days: 7
